<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>📚 Gavin期末复习资料</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f5f7fb;
      --card: rgba(255, 255, 255, 0.92);
      --text: #182230;
      --muted: #667085;
      --accent: #2563eb;
      --border: #e4e7ec;
      --shadow: 0 10px 30px rgba(16, 24, 40, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding:
        max(28px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(36px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      color: var(--text);
      background:
        radial-gradient(circle at top left, #e7efff 0, transparent 38%),
        var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    header {
      padding: 10px 4px 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 7vw, 2.5rem);
      line-height: 1.25;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .subjects {
      display: grid;
      gap: 14px;
    }

    a {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 64px;
      padding: 16px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--text);
      background: var(--card);
      box-shadow: var(--shadow);
      text-decoration: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      -webkit-tap-highlight-color: transparent;
    }

    a::before {
      content: "📂";
      flex: 0 0 auto;
      font-size: 1.2rem;
    }

    a::after {
      content: "›";
      margin-left: auto;
      color: #98a2b3;
      font-size: 1.5rem;
      line-height: 1;
    }

    a:active {
      color: var(--accent);
      background: #f0f5ff;
    }

    footer {
      padding: 24px 4px 0;
      color: var(--muted);
      text-align: center;
      font-size: 0.85rem;
    }

    @media (min-width: 700px) {
      body {
        padding-top: 48px;
      }

      .subjects {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      a:hover,
      a:focus-visible {
        color: var(--accent);
        background: #f0f5ff;
        outline: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>📚 Gavin期末复习资料</h1>
      <p class="subtitle">选择科目文件夹，进入对应复习资料目录。</p>
    </header>

    <nav class="subjects" aria-label="科目文件夹">
      <a href="国际金融/">国际金融</a>
      <a href="国际经济学/">国际经济学</a>
      <a href="财政学/">财政学</a>
      <a href="程序设计/">程序设计</a>
      <a href="概率论与数理统计/">概率论与数理统计</a>
    </nav>

    <footer>愿复习顺利，考试稳稳拿下 ✨</footer>
  </main>
</body>
</html>

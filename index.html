<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>📚 Gavin期末复习资料</title>
  <style>
    :root {
      color-scheme: light;
      --background: #f5f7fb;
      --card: rgba(255, 255, 255, 0.92);
      --text: #182230;
      --muted: #667085;
      --accent: #2563eb;
      --border: #e4e7ec;
      --shadow: 0 10px 30px rgba(16, 24, 40, 0.07);
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding:
        max(28px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(36px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      color: var(--text);
      background:
        radial-gradient(circle at top left, #e7efff 0, transparent 38%),
        var(--background);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 760px);
      margin: 0 auto;
    }

    header {
      padding: 10px 4px 22px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 7vw, 2.5rem);
      line-height: 1.25;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .groups {
      display: grid;
      gap: 16px;
    }

    section {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    h2 {
      margin: 0;
      padding: 18px 20px 12px;
      font-size: 1.18rem;
    }

    ul {
      margin: 0;
      padding: 0 12px 12px;
      list-style: none;
    }

    li + li {
      border-top: 1px solid var(--border);
    }

    a {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 54px;
      padding: 12px 8px;
      color: var(--text);
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
    }

    a::before {
      content: "📄";
      flex: 0 0 auto;
    }

    a::after {
      content: "›";
      margin-left: auto;
      color: #98a2b3;
      font-size: 1.5rem;
      line-height: 1;
    }

    a:active {
      color: var(--accent);
      background: #f0f5ff;
      border-radius: 10px;
    }

    footer {
      padding: 24px 4px 0;
      color: var(--muted);
      text-align: center;
      font-size: 0.85rem;
    }

    @media (min-width: 700px) {
      body {
        padding-top: 48px;
      }

      .groups {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      section:first-child {
        grid-column: 1 / -1;
      }

      a:hover,
      a:focus-visible {
        color: var(--accent);
        background: #f0f5ff;
        border-radius: 10px;
        outline: none;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>📚 Gavin期末复习资料</h1>
      <p class="subtitle">选择科目，开始复习。</p>
    </header>

    <div class="groups">
      <section>
        <h2>国际金融</h2>
        <ul>
          <li><a href="国际金融/国际金融期末复习救命包_v4_完整版.html">国际金融期末复习救命包 v4 完整版</a></li>
          <li><a href="国际金融/国际金融期末刷题包_v1_可交互.html">国际金融期末刷题包 v1 可交互</a></li>
        </ul>
      </section>

      <section>
        <h2>财政学</h2>
        <ul>
          <li><a href="财政学/财政学专题练习与仿真卷（外招生金融学版）.html">财政学专题练习与仿真卷（外招生金融学版）</a></li>
          <li><a href="财政学/财政学总复习资料（外招生金融学版）.html">财政学总复习资料（外招生金融学版）</a></li>
        </ul>
      </section>

      <section>
        <h2>程序设计</h2>
        <ul>
          <li><a href="程序设计/Python程序设计基础_复习资料.html">Python程序设计基础：复习资料</a></li>
          <li><a href="程序设计/Python程序设计基础_练习题.html">Python程序设计基础：练习题</a></li>
        </ul>
      </section>
    </div>

    <footer>愿复习顺利，考试稳稳拿下 ✨</footer>
  </main>
</body>
</html>
